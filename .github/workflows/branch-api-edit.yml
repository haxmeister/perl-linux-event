name: Branch tuning terminology migration

on:
  push:
    branches:
      - feature/listener-stream-recipe-runtime-tuning-tls

permissions:
  contents: write

jobs:
  edit:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out implementation branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: feature/listener-stream-recipe-runtime-tuning-tls

      - name: Rename stream tuning terminology
        shell: bash
        run: |
          while IFS= read -r path; do
            [ "$path" = handoff.md ] && continue
            perl -0pi -e 's/stream_options/stream_tuning/g' "$path"
          done < <(git grep -Il 'stream_options' -- . || true)
          git diff --check
          echo '--- remaining stream_class references ---'
          git grep -n 'stream_class' -- . || true
          echo '--- remaining stream_options references (handoff expected) ---'
          git grep -n 'stream_options' -- . || true

      - name: Commit terminology migration
        shell: bash
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name 'Joshua S. Day'
          git config user.email 'hax@cpan.org'
          git add -A ':!.github/workflows/branch-api-edit.yml'
          git commit -m 'Rename Stream tuning API across tests and documentation'
          git push origin HEAD:feature/listener-stream-recipe-runtime-tuning-tls
