name: Finalize API Changes

on:
  push:
    branches:
      - feature/listener-stream-recipe-runtime-tuning-tls

permissions:
  contents: write

jobs:
  edit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: feature/listener-stream-recipe-runtime-tuning-tls
      - name: Finalize Changes
        run: python3 .github/scripts/final-changes-fix.py
      - name: Commit Changes
        run: |
          git diff --check
          if git diff --quiet; then exit 0; fi
          git config user.name 'Joshua S. Day'
          git config user.email 'hax@cpan.org'
          git add Changes
          git commit -m 'Document Listener recipe and runtime tuning API changes'
          git push origin HEAD:feature/listener-stream-recipe-runtime-tuning-tls
