name: Branch API edit

on:
  push:
    branches:
      - feature/listener-stream-recipe-runtime-tuning-tls

permissions:
  contents: write

jobs:
  edit:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out implementation branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: feature/listener-stream-recipe-runtime-tuning-tls

      - name: Apply prepared TLS and benchmark migration
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace(path, old, new):
              p = Path(path)
              text = p.read_text()
              if old not in text:
                  raise SystemExit(f"expected text not found in {path}: {old[:80]!r}")
              p.write_text(text.replace(old, new, 1))

          listener = 'lib/Linux/Event/_Socket/Listener.pm'
          replace(listener,
          """    my $data = delete $stream{data};
              my $tls = delete $stream{tls};
              croak 'new(): stream tls must be a hash reference'
                  if defined($tls) && ref($tls) ne 'HASH';
          """,
          """    my $data = delete $stream{data};
              my $tls_enabled = exists $stream{tls};
              my $tls = delete $stream{tls};
              croak 'new(): stream tls must be a hash reference'
                  if $tls_enabled && ref($tls) ne 'HASH';
          """)

          replace(listener,
          """    return {
                  class                => $stream_class,
                  descriptor           => $prepared,
                  data                 => $data,
                  tuning               => $prepared->{options},
                  callbacks            => \\%callback,
                  constructor_callbacks => \\%constructor_callback,
                  tls                  => $tls,
              };
          """,
          """    my $tls_template;
              if ($tls_enabled) {
                  require Linux::Event::TLS;
                  $tls_template = Linux::Event::TLS->_prepare_listener_server(
                      $stream_class, $tls,
                  );
              }

              return {
                  class                 => $stream_class,
                  descriptor            => $prepared,
                  data                  => $data,
                  tuning                => $prepared->{options},
                  callbacks             => \\%callback,
                  constructor_callbacks => \\%constructor_callback,
                  tls_template          => $tls_template,
              };
          """)

          replace(listener,
          """    my $stream;
              my $prepared = eval {
                  $stream = Linux::Event::_ByteStream::Descriptor::with_prepared(
          """,
          """    my $stream;
              my $prepared = eval {
                  my $transport;
                  if (defined $recipe->{tls_template}) {
                      require Linux::Event::TLS;
                      $transport = Linux::Event::TLS->_listener_server_connection(
                          $recipe->{tls_template},
                      );
                  }
                  $stream = Linux::Event::_ByteStream::Descriptor::with_prepared(
          """)

          replace(listener,
          """            _accepted => 1,
                      %{ $recipe->{constructor_callbacks} },
          """,
          """            _accepted => 1,
                      transport => $transport,
                      %{ $recipe->{constructor_callbacks} },
          """)

          stream = 'lib/Linux/Event/_Socket/Stream.pm'
          replace(stream,
          """    if (my $tls = $socket_descriptor->{tls}) {
                  croak 'new(): transport cannot be supplied for a TLS-declared Socket'
                      if defined $transport;
                  require Linux::Event::TLS;
                  my $role = $accepted ? 'server' : $tls_role;
                  croak 'new(): a TLS-declared adopted fh requires tls_role'
                      if !defined $role;
                  croak 'new(): tls_role must be client or server'
                      if $role ne 'client' && $role ne 'server';
                  $transport = $role eq 'server'
                      ? Linux::Event::TLS->_server_from_declaration($tls)
                      : Linux::Event::TLS->_client_from_declaration($tls);
              } elsif (defined $tls_role) {
          """,
          """    if (my $tls = $socket_descriptor->{tls}) {
                  if (defined $transport) {
                      croak 'new(): transport cannot be supplied for a TLS-declared Socket'
                          if !$accepted;
                  } else {
                      require Linux::Event::TLS;
                      my $role = $accepted ? 'server' : $tls_role;
                      croak 'new(): a TLS-declared adopted fh requires tls_role'
                          if !defined $role;
                      croak 'new(): tls_role must be client or server'
                          if $role ne 'client' && $role ne 'server';
                      $transport = $role eq 'server'
                          ? Linux::Event::TLS->_server_from_declaration($tls)
                          : Linux::Event::TLS->_client_from_declaration($tls);
                  }
              } elsif (defined $tls_role) {
          """)

          bench = 'bench/run-performance-regression.pl'
          p = Path(bench)
          text = p.read_text().replace('sub stream_options (\\$class)', 'sub stream_tuning (\\$class)')
          old = """    my $listener = Linux::Event::Bench::Regression::ConnectionListener->new(
                  stream_class => 'Linux::Event::Bench::Regression::ConnectionServer',
                  host => '127.0.0.1', port => 0, data => $run,
              );
          """
          new = """    my $listener = Linux::Event::Bench::Regression::ConnectionListener->new(
                  host => '127.0.0.1', port => 0,
                  stream => {
                      class => 'Linux::Event::Bench::Regression::ConnectionServer',
                      data  => $run,
                  },
              );
          """
          if old not in text:
              raise SystemExit('expected connection-listener benchmark block not found')
          p.write_text(text.replace(old, new, 1))
          PY

          git diff --check
          git diff -- lib/Linux/Event/_Socket/Listener.pm lib/Linux/Event/_Socket/Stream.pm bench/run-performance-regression.pl

      - name: Commit branch edits
        shell: bash
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name 'Joshua S. Day'
          git config user.email 'hax@cpan.org'
          git add lib/Linux/Event/_Socket/Listener.pm lib/Linux/Event/_Socket/Stream.pm bench/run-performance-regression.pl
          git commit -m 'Wire prepared Listener TLS into accepted Streams'
          git push origin HEAD:feature/listener-stream-recipe-runtime-tuning-tls
