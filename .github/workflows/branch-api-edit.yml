name: Register TLS setup benchmark

on:
  push:
    branches:
      - feature/listener-stream-recipe-runtime-tuning-tls

permissions:
  contents: write

jobs:
  edit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: feature/listener-stream-recipe-runtime-tuning-tls
      - name: Register benchmark
        run: python3 .github/scripts/register-tls-setup-benchmark.py
      - name: Commit registration
        run: |
          git diff --check
          if git diff --quiet; then exit 0; fi
          git config user.name 'Joshua S. Day'
          git config user.email 'hax@cpan.org'
          git add MANIFEST t/20-public-surface.t bench/README.md
          git commit -m 'Register prepared TLS setup benchmark'
          git push origin HEAD:feature/listener-stream-recipe-runtime-tuning-tls
