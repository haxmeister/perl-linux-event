name: Branch Listener test migration

on:
  push:
    branches:
      - feature/listener-stream-recipe-runtime-tuning-tls

permissions:
  contents: write

jobs:
  edit:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out implementation branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: feature/listener-stream-recipe-runtime-tuning-tls

      - name: Migrate Listener tests to stream recipes
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def rep(path, old, new, count=1):
              p = Path(path)
              text = p.read_text()
              if text.count(old) < count:
                  raise SystemExit(f'{path}: expected replacement not found: {old[:100]!r}')
              p.write_text(text.replace(old, new, count))

          def allrep(path, old, new):
              p = Path(path)
              text = p.read_text()
              if old not in text:
                  raise SystemExit(f'{path}: expected text not found: {old!r}')
              p.write_text(text.replace(old, new))

          allrep('t/listener-00-api.t',
              "stream_class => 'T::ListenerProbeStream',",
              "stream => { class => 'T::ListenerProbeStream' },")

          rep('t/35-loop-introspection-types.t',
              "loop => $loop, stream_class => 'T::InspectStream',",
              "loop => $loop, stream => { class => 'T::InspectStream' },")

          rep('t/listener-10-tcp.t',
              'my $state = $listener->data;',
              'my $state = $stream->data;')
          rep('t/listener-10-tcp.t',
          """my $listener = T::AcceptedTCPListener->new(
              stream_class => 'T::AcceptedTCPStream',
              loop => $LOOP, host => '127.0.0.1', port => 0, data => $STATE,
          );""",
          """my $listener = T::AcceptedTCPListener->new(
              loop => $LOOP, host => '127.0.0.1', port => 0,
              stream => { class => 'T::AcceptedTCPStream', data => $STATE },
          );""")

          rep('t/listener-11-stream.t',
          """my $listener = Linux::Event::IO::Sock::Listener->new(
              stream_class => 'T::LineEchoStream',
              loop => $loop, host => '127.0.0.1', port => 0, data => $state,
          );""",
          """my $listener = Linux::Event::IO::Sock::Listener->new(
              loop => $loop, host => '127.0.0.1', port => 0,
              stream => { class => 'T::LineEchoStream', data => $state },
          );""")

          rep('t/listener-12-batch.t',
          """my $listener = Linux::Event::IO::Sock::Listener->new(
              stream_class => 'T::BatchStream',
              loop => $loop, host => '127.0.0.1', port => 0, data => $state,
              max_accept_per_tick => 2,
          );""",
          """my $listener = Linux::Event::IO::Sock::Listener->new(
              loop => $loop, host => '127.0.0.1', port => 0,
              stream => { class => 'T::BatchStream', data => $state },
              max_accept_per_tick => 2,
          );""")

          allrep('t/listener-14-ownership.t',
              "stream_class => 'T::OwnedStream',",
              "stream => { class => 'T::OwnedStream' },")

          rep('t/listener-15-unix.t',
          """        stream_class => 'T::UnixStream',
                  loop => $loop, unix => $path, permissions => 0600, data => $state,""",
          """        loop => $loop, unix => $path, permissions => 0600,
                  stream => { class => 'T::UnixStream', data => $state },""")
          rep('t/listener-15-unix.t',
              "stream_class => 'T::UnixStream', # required",
              "stream       => { class => 'T::UnixStream' },")

          rep('t/listener-16-callbacks.t',
              '$listener->data->{stream} = $stream;',
              '$stream->data->{stream} = $stream;')
          rep('t/listener-16-callbacks.t',
          """my $listener = T::FailingAcceptListener->new(
              loop         => $loop,
              stream_class => 'T::CallbackStream',
              host         => '127.0.0.1',
              port         => 0,
              data         => $state,
          );""",
          """my $listener = T::FailingAcceptListener->new(
              loop => $loop,
              host => '127.0.0.1',
              port => 0,
              stream => { class => 'T::CallbackStream', data => $state },
              on_error => sub ($listener, $error) {
                  $state->{error} = $error;
                  $listener->loop->stop;
              },
          );""")
          rep('t/listener-16-callbacks.t',
          """my $setup_listener = T::SetupFailureListener->new(
              loop         => $setup_loop,
              stream_class => 'T::BrokenAttachStream',
              host         => '127.0.0.1',
              port         => 0,
              data         => $setup_state,
          );""",
          """my $setup_listener = T::SetupFailureListener->new(
              loop => $setup_loop,
              host => '127.0.0.1',
              port => 0,
              stream => { class => 'T::BrokenAttachStream', data => $setup_state },
              on_error => sub ($listener, $error) {
                  $setup_state->{setup_error} = $error;
                  $listener->loop->stop;
              },
          );""")

          rep('t/listener-17-first-class-stream-callbacks.t',
          """        stream_class => 'T::ListenerCallbacks::Raw',
                  data => $state,
                  on_data => $callback,
                  on_ready => sub ($stream) { $stream->data->{ready}++ },
                  on_close => sub ($stream) { $stream->data->{close}++ },""",
          """        stream => {
                      class => 'T::ListenerCallbacks::Raw',
                      data => $state,
                      on_data => $callback,
                      on_ready => sub ($stream) { $stream->data->{ready}++ },
                      on_close => sub ($stream) { $stream->data->{close}++ },
                  },""")
          rep('t/listener-17-first-class-stream-callbacks.t',
          """        stream_class => 'T::ListenerCallbacks::Line',
                  on_message => sub ($stream, $value) {
                      push @message, $value;
                      $stream->close;
                      $loop->stop;
                  },""",
          """        stream => {
                      class => 'T::ListenerCallbacks::Line',
                      on_message => sub ($stream, $value) {
                          push @message, $value;
                          $stream->close;
                          $loop->stop;
                      },
                  },""")
          rep('t/listener-17-first-class-stream-callbacks.t',
          """            stream_class => 'T::ListenerCallbacks::Raw',
                      on_message => sub { },""",
          """            stream => {
                          class => 'T::ListenerCallbacks::Raw',
                          on_message => sub { },
                      },""")

          rep('t/stream-41-connect-listen.t',
              "stream_class => 'T::AutomaticEcho',",
              "stream => { class => 'T::AutomaticEcho' },")
          rep('t/stream-46-async-resolver.t',
              "stream_class => 'T::ResolverServer', host => '127.0.0.1', port => 0,",
              "stream => { class => 'T::ResolverServer' }, host => '127.0.0.1', port => 0,")
          rep('t/stream-50-tcp-socket-options.t',
              "stream_class => 'T::ConfiguredServer', # required",
              "stream       => { class => 'T::ConfiguredServer' },")
          rep('t/stream-52-preconnect-backpressure.t',
          """    stream_class => 'T::PreconnectSink',
              host => '127.0.0.1', port => 0, data => $state,""",
          """    host => '127.0.0.1', port => 0,
              stream => { class => 'T::PreconnectSink', data => $state },""")
          rep('t/stream-53-adopted-and-callback-close.t',
              "loop => $loop, stream_class => 'T::ReadySink',",
              "loop => $loop, stream => { class => 'T::ReadySink' },")

          git_paths = [
              't/35-loop-introspection-types.t', 't/listener-00-api.t',
              't/listener-10-tcp.t', 't/listener-11-stream.t',
              't/listener-12-batch.t', 't/listener-14-ownership.t',
              't/listener-15-unix.t', 't/listener-16-callbacks.t',
              't/listener-17-first-class-stream-callbacks.t',
              't/stream-41-connect-listen.t', 't/stream-46-async-resolver.t',
              't/stream-50-tcp-socket-options.t',
              't/stream-52-preconnect-backpressure.t',
              't/stream-53-adopted-and-callback-close.t',
          ]
          print('\n'.join(git_paths))
          PY

          git diff --check
          echo '--- remaining stream_class references in tests ---'
          git grep -n 'stream_class' -- 't/*' || true

      - name: Commit Listener test migration
        shell: bash
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name 'Joshua S. Day'
          git config user.email 'hax@cpan.org'
          git add t/
          git commit -m 'Migrate Listener tests to stream recipes'
          git push origin HEAD:feature/listener-stream-recipe-runtime-tuning-tls
