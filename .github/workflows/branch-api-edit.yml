name: Final API documentation migration

on:
  push:
    branches:
      - feature/listener-stream-recipe-runtime-tuning-tls

permissions:
  contents: write

jobs:
  edit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: feature/listener-stream-recipe-runtime-tuning-tls
      - name: Apply documentation migration
        run: python3 .github/scripts/final-api-doc-migration.py
      - name: Commit documentation migration
        run: |
          git diff --check
          if git diff --quiet; then exit 0; fi
          git config user.name 'Joshua S. Day'
          git config user.email 'hax@cpan.org'
          git add lib/Linux/Event/IO/Sock/Stream.pm lib/Linux/Event/TLS.pm \
            docs/FIRST-CLASS-STREAM-CALLBACKS.md
          git commit -m 'Finish runtime tuning and TLS public documentation'
          git push origin HEAD:feature/listener-stream-recipe-runtime-tuning-tls
