name: Branch CI failure fixes

on:
  push:
    branches:
      - feature/listener-stream-recipe-runtime-tuning-tls

permissions:
  contents: write

jobs:
  edit:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out implementation branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: feature/listener-stream-recipe-runtime-tuning-tls

      - name: Apply focused CI fixes
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace(path, old, new, count=1):
              p = Path(path)
              text = p.read_text()
              if text.count(old) < count:
                  raise SystemExit(f'{path}: expected text not found: {old[:120]!r}')
              p.write_text(text.replace(old, new, count))

          # Preserve the terminal error callback across shutdown cleanup.
          replace(
              'lib/Linux/Event/_Socket/Listener.pm',
              """    $self->{last_error} = $error;
              $self->_shutdown('failed', 1);
              my $reported = eval {
                  $self->{listener_callbacks}{on_error}->($self, $error);
                  1;
              };
          """,
              """    $self->{last_error} = $error;
              my $on_error = $self->{listener_callbacks}{on_error};
              $self->_shutdown('failed', 1);
              my $reported = eval {
                  $on_error->($self, $error);
                  1;
              };
          """,
          )

          # An explicit empty Listener TLS recipe is still a TLS request and
          # must fail without server credentials.
          replace(
              'lib/Linux/Event/TLS.pm',
              """    my %option = (%{ _class_tls_defaults($stream_class) }, %{ $recipe // {} });
              return undef if !%option;

              my %known = map { $_ => 1 } qw(
          """,
              """    my %option = (%{ _class_tls_defaults($stream_class) }, %{ $recipe // {} });

              my %known = map { $_ => 1 } qw(
          """,
          )

          # The live batching API deliberately allows both callbacks so a
          # Stream can switch policies without changing protocol class.
          replace(
              't/stream-55-callback-batching.t',
              """    like(descriptor_error('T::Batch::InvalidBothMessageCallbacks'),
                  qr/cannot define both on_message.*on_messages/,
                  'batch mode rejects ambiguous callbacks');
              like(descriptor_error('T::Batch::InvalidUnconfiguredMessages'),
                  qr/on_messages.*without enabling message_batch_size/,
                  'batch callback requires explicit policy');
          """,
              """    is(descriptor_error('T::Batch::InvalidBothMessageCallbacks'), '',
                  'a framed class may provide both callbacks for live batch switching');
              like(descriptor_error('T::Batch::InvalidUnconfiguredMessages'),
                  qr/readable framed Stream requires on_message or a native consumer/,
                  'initial unbatched policy still requires an effective on_message sink');
          """,
          )
          replace(
              't/stream-55-callback-batching.t',
              "subtest 'batching policies reject ambiguous class contracts' => sub {",
              "subtest 'batching policies validate class contracts' => sub {",
          )

          # Migrate the callback construction benchmark while preserving its
          # three benchmark styles and fresh-closure accounting.
          replace(
              'bench/run-first-class-callback-construction-bench.pl',
              """    my $listener = Linux::Event::Bench::CallbackListener->new(
                  loop => $loop, host => '127.0.0.1', port => 0,
                  stream_class => $stream_class, data => $run, %callback,
              );
          """,
              """    my $listener = Linux::Event::Bench::CallbackListener->new(
                  loop => $loop, host => '127.0.0.1', port => 0,
                  stream => {
                      class => $stream_class,
                      data  => $run,
                      %callback,
                  },
              );
          """,
          )

          # Register the new regression test in the distribution manifest.
          manifest = Path('MANIFEST')
          text = manifest.read_text()
          entry = 't/stream-60-runtime-tuning.t\n'
          if entry not in text:
              marker = 't/stream-60-generic-handles.t\n'
              if marker not in text:
                  raise SystemExit('MANIFEST stream-60 marker not found')
              text = text.replace(marker, marker + entry, 1)
              manifest.write_text(text)
          PY

          git diff --check

      - name: Commit focused CI fixes
        shell: bash
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name 'Joshua S. Day'
          git config user.email 'hax@cpan.org'
          git add lib/Linux/Event/_Socket/Listener.pm lib/Linux/Event/TLS.pm \
            t/stream-55-callback-batching.t \
            bench/run-first-class-callback-construction-bench.pl MANIFEST
          git commit -m 'Fix Listener terminal callbacks and migrated API fixtures'
          git push origin HEAD:feature/listener-stream-recipe-runtime-tuning-tls
