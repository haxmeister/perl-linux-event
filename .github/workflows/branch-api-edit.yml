name: Branch live tuning callback fix

on:
  push:
    branches:
      - feature/listener-stream-recipe-runtime-tuning-tls

permissions:
  contents: write

jobs:
  edit:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out implementation branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: feature/listener-stream-recipe-runtime-tuning-tls

      - name: Apply live tuning callback fix
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('xsbytestream/stream_transition.c')
          s = p.read_text()
          s = s.replace(
              '    SV *input_cb_sv = les_tuning_value(aTHX_ tuning, "input_cb");\n    SV *next_input_cb = NULL;\n',
              '    SV **input_cb_slot = hv_fetch(tuning, "input_cb", 8, 0);\n    SV *input_cb_sv = input_cb_slot ? *input_cb_slot : NULL;\n    int replace_input_cb = input_cb_slot ? 1 : 0;\n    SV *next_input_cb = NULL;\n',
              1,
          )
          s = s.replace(
              '    if (descriptor->consumer_ops && input_cb_sv && SvOK(input_cb_sv))\n        croak("tune(): native consumer cannot use a Perl input callback");\n    if (st->read_fd >= 0 && !descriptor->consumer_ops\n        && (!input_cb_sv || !SvOK(input_cb_sv)))\n        croak("tune(): readable Stream requires an effective input callback");\n',
              '    if (descriptor->consumer_ops && replace_input_cb\n        && input_cb_sv && SvOK(input_cb_sv))\n        croak("tune(): native consumer cannot use a Perl input callback");\n    if (replace_input_cb && st->read_fd >= 0 && !descriptor->consumer_ops\n        && (!input_cb_sv || !SvOK(input_cb_sv)))\n        croak("tune(): readable Stream requires an effective input callback");\n',
              1,
          )
          s = s.replace(
              '    next_input_cb = les_store_optional_cb(input_cb_sv,\n        "tune() input callback");\n',
              '    if (replace_input_cb)\n        next_input_cb = les_store_optional_cb(input_cb_sv,\n            "tune() input callback");\n',
              1,
          )
          s = s.replace(
              '    old_input_cb = st->input_cb;\n    old_instance_input_cb = st->instance_input_cb;\n    st->input_cb = next_input_cb;\n    st->instance_input_cb = NULL;\n    st->instance_input_kind = LES_CALLBACK_NONE;\n    if (old_input_cb && old_input_cb != old_instance_input_cb)\n        SvREFCNT_dec(old_input_cb);\n    if (old_instance_input_cb)\n        SvREFCNT_dec(old_instance_input_cb);\n',
              '    if (replace_input_cb) {\n        old_input_cb = st->input_cb;\n        old_instance_input_cb = st->instance_input_cb;\n        st->input_cb = next_input_cb;\n        st->instance_input_cb = NULL;\n        st->instance_input_kind = LES_CALLBACK_NONE;\n        if (old_input_cb && old_input_cb != old_instance_input_cb)\n            SvREFCNT_dec(old_input_cb);\n        if (old_instance_input_cb)\n            SvREFCNT_dec(old_instance_input_cb);\n    }\n',
              1,
          )
          p.write_text(s)
          PY
          git diff --check
          git diff --exit-code -- xsbytestream/stream_transition.c && exit 1 || true

      - name: Commit live tuning callback fix
        shell: bash
        run: |
          git config user.name 'Joshua S. Day'
          git config user.email 'hax@cpan.org'
          git add xsbytestream/stream_transition.c
          git commit -m 'Preserve input callback for ordinary live tuning'
          git push origin HEAD:feature/listener-stream-recipe-runtime-tuning-tls
