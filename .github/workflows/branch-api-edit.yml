name: Branch runtime TLS semantics

on:
  push:
    branches:
      - feature/listener-stream-recipe-runtime-tuning-tls

permissions:
  contents: write

jobs:
  edit:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out implementation branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: feature/listener-stream-recipe-runtime-tuning-tls

      - name: Apply acquisition-time TLS semantics and tests
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def rep(path, old, new, count=1):
              p = Path(path)
              text = p.read_text()
              if text.count(old) < count:
                  raise SystemExit(f'{path}: expected replacement not found: {old[:120]!r}')
              p.write_text(text.replace(old, new, count))

          stream = 'lib/Linux/Event/_Socket/Stream.pm'
          rep(stream,
          """    if (my $tls = $socket_descriptor->{tls}) {
                  if (defined $transport) {
                      croak 'new(): transport cannot be supplied for a TLS-declared Socket'
                          if !$accepted;
                  } else {
                      require Linux::Event::TLS;
                      my $role = $accepted ? 'server' : $tls_role;
                      croak 'new(): a TLS-declared adopted fh requires tls_role'
                          if !defined $role;
                      croak 'new(): tls_role must be client or server'
                          if $role ne 'client' && $role ne 'server';
                      $transport = $role eq 'server'
                          ? Linux::Event::TLS->_server_from_declaration($tls)
                          : Linux::Event::TLS->_client_from_declaration($tls);
                  }
              } elsif (defined $tls_role) {
          """,
          """    if (my $tls = $socket_descriptor->{tls}) {
                  if (!$accepted) {
                      croak 'new(): transport cannot be supplied for a TLS-declared Socket'
                          if defined $transport;
                      require Linux::Event::TLS;
                      croak 'new(): a TLS-declared adopted fh requires tls_role'
                          if !defined $tls_role;
                      croak 'new(): tls_role must be client or server'
                          if $tls_role ne 'client' && $tls_role ne 'server';
                      $transport = $tls_role eq 'server'
                          ? Linux::Event::TLS->_server_from_declaration($tls)
                          : Linux::Event::TLS->_client_from_declaration($tls);
                  }
                  # Accepted sockets acquire TLS only from the Listener recipe.
                  # A class declaration/default never activates TLS by itself.
              } elsif (defined $tls_role) {
          """)

          tls01 = 't/tls-01-declaration.t'
          p = Path(tls01)
          text = p.read_text()
          insert_after = """{
              package T::InheritedTLSServer;
              use parent -norequire, 'T::DeclaredTLSServer';
          }
          """
          addition = """
          {
              package T::RuntimeTLSServer;
              use parent 'Linux::Event::IO::Sock::Stream';
              sub tls_defaults ($class) {
                  return alpn => ['declaration-test/1'];
              }
              sub on_data ($stream, $bytes) { return }
          }
          """
          if insert_after not in text:
              raise SystemExit('tls-01: insertion point not found')
          text = text.replace(insert_after, insert_after + addition, 1)
          old_listener = """my $listener = Linux::Event::IO::Sock::Listener->new(
              stream_class => 'T::InheritedTLSServer',
              host         => '127.0.0.1',
              port         => 0,
          );
          ok($listener->port > 0,
              'Listener accepts an inherited TLS stream-socket declaration');
          $listener->close;
          """
          new_listener = """my $listener = Linux::Event::IO::Sock::Listener->new(
              host => '127.0.0.1',
              port => 0,
              stream => {
                  class => 'T::RuntimeTLSServer',
                  tls => {
                      cert_file => \"$FindBin::Bin/tls-certs/server-cert.pem\",
                      key_file  => \"$FindBin::Bin/tls-certs/server-key.pem\",
                  },
              },
          );
          ok($listener->port > 0,
              'Listener prepares runtime TLS from the generated-Stream recipe');
          $listener->close;
          """
          if old_listener not in text:
              raise SystemExit('tls-01: old Listener block not found')
          text = text.replace(old_listener, new_listener, 1)
          old_missing = """    Linux::Event::IO::Sock::Listener->new(
                  stream_class => 'T::TLSWithoutCertificate',
                  host         => '127.0.0.1',
                  port         => 0,
              );"""
          new_missing = """    Linux::Event::IO::Sock::Listener->new(
                  host => '127.0.0.1',
                  port => 0,
                  stream => {
                      class => 'T::TLSWithoutCertificate',
                      tls   => {},
                  },
              );"""
          if old_missing not in text:
              raise SystemExit('tls-01: missing certificate block not found')
          text = text.replace(old_missing, new_missing, 1)
          text = text.replace(
              "qr/does not declare cert_file and key_file/",
              "qr/requires cert_file and key_file/", 1)
          old_unreadable = """    Linux::Event::IO::Sock::Listener->new(
                  stream_class => 'T::TLSWithUnreadableCertificate',
                  host         => '127.0.0.1',
                  port         => 0,
              );"""
          new_unreadable = """    Linux::Event::IO::Sock::Listener->new(
                  host => '127.0.0.1',
                  port => 0,
                  stream => {
                      class => 'T::TLSWithUnreadableCertificate',
                      tls => {
                          cert_file => \"$FindBin::Bin/tls-certs/missing-cert.pem\",
                          key_file  => \"$FindBin::Bin/tls-certs/missing-key.pem\",
                      },
                  },
              );"""
          if old_unreadable not in text:
              raise SystemExit('tls-01: unreadable certificate block not found')
          text = text.replace(old_unreadable, new_unreadable, 1)
          p.write_text(text)

          tls40 = 't/tls-40-connect-listen.t'
          p = Path(tls40)
          text = p.read_text()
          text = text.replace(
              "use Scalar::Util qw(refaddr);\n",
              "use Scalar::Util qw(refaddr);\nuse Socket qw(AF_INET SOCK_STREAM inet_aton pack_sockaddr_in);\n",
              1,
          )
          old_server_decl = """    use Linux::Event::TLS
                  cert_file => \"$FindBin::Bin/tls-certs/server-cert.pem\",
                  key_file  => \"$FindBin::Bin/tls-certs/server-key.pem\",
                  alpn      => ['les-integrated/1'];

          """
          if old_server_decl not in text:
              raise SystemExit('tls-40: server declaration not found')
          text = text.replace(old_server_decl, '', 1)
          old_listener40 = """my $listener = $LOOP->add(T::IntegratedTLSListener->new(
              stream_class => 'T::IntegratedTLSServer',
              host => '127.0.0.1', port => 0, data => $STATE,
          ));"""
          new_listener40 = """my $listener = $LOOP->add(T::IntegratedTLSListener->new(
              host => '127.0.0.1', port => 0,
              stream => {
                  class => 'T::IntegratedTLSServer',
                  data  => $STATE,
                  tls => {
                      cert_file => \"$FindBin::Bin/tls-certs/server-cert.pem\",
                      key_file  => \"$FindBin::Bin/tls-certs/server-key.pem\",
                      alpn      => ['les-integrated/1'],
                  },
              },
          ));"""
          if old_listener40 not in text:
              raise SystemExit('tls-40: old Listener block not found')
          text = text.replace(old_listener40, new_listener40, 1)

          marker = "$LOOP = Linux::Event::Loop->new;\n\n"
          plain_test = """$LOOP = Linux::Event::Loop->new;

          my $plain_loop = Linux::Event::Loop->new;
          my $plain_transport;
          my $plain_listener = Linux::Event::IO::Sock::Listener->new(
              loop => $plain_loop,
              host => '127.0.0.1',
              port => 0,
              stream => {
                  class => 'T::IntegratedTLSServer',
                  data  => $STATE,
              },
              on_accept => sub ($listener, $stream) {
                  $plain_transport = $stream->transport;
                  $stream->close;
                  $plain_loop->stop;
              },
          );
          socket(my $plain_client, AF_INET, SOCK_STREAM, 0) or die \"socket: $!\";
          connect($plain_client,
              pack_sockaddr_in($plain_listener->port, inet_aton('127.0.0.1')))
              or die \"connect: $!\";
          $plain_loop->run;
          ok(!defined($plain_transport),
              'the same Stream class remains plain when Listener tls is omitted');
          close $plain_client;
          $plain_listener->close;

          """
          if marker not in text:
              raise SystemExit('tls-40: plain test insertion marker not found')
          text = text.replace(marker, plain_test, 1)
          p.write_text(text)
          PY

          git diff --check
          git grep -n 'stream_class' -- t/tls-01-declaration.t t/tls-40-connect-listen.t || true

      - name: Commit runtime TLS semantics
        shell: bash
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name 'Joshua S. Day'
          git config user.email 'hax@cpan.org'
          git add lib/Linux/Event/_Socket/Stream.pm t/tls-01-declaration.t t/tls-40-connect-listen.t
          git commit -m 'Make Listener TLS acquisition-time policy'
          git push origin HEAD:feature/listener-stream-recipe-runtime-tuning-tls
