name: Coherent core refactor

on:
  push:
    branches: [refactor/coherent-private-core]
    paths:
      - tools/coherent-core-refactor.py
      - tools/coherent-core-refactor-fixup.py
      - tools/coherent-core-contract-fixup.py
      - tools/coherent-core-native-names-fixup.py
      - .github/workflows/coherent-core-refactor.yml

permissions:
  contents: write

jobs:
  refactor:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Check out refactor branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: refactor/coherent-private-core

      - name: Set up Perl
        uses: shogo82148/actions-setup-perl@c3e9892cade8a01db1a8498b756f48d6ca98b678 # v1
        with:
          perl-version: "5"
          multi-thread: false

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes libssl-dev
          cpanm --notest --installdeps .

      - name: Apply structural refactor
        run: |
          if [[ -f lib/Linux/Event/Stream.pm ]]; then
            python3 tools/coherent-core-refactor.py
          elif [[ -f lib/Linux/Event/_ByteStream.pm ]]; then
            echo "coherent structural refactor already applied"
          else
            echo "inconsistent tree: neither legacy Stream.pm nor coherent _ByteStream.pm exists" >&2
            exit 1
          fi
          python3 tools/coherent-core-refactor-fixup.py
          python3 tools/coherent-core-contract-fixup.py
          python3 tools/coherent-core-native-names-fixup.py

      - name: Build transformed tree
        run: |
          perl Makefile.PL
          make manifest
          make --jobs=2

      - name: Test architecture and core contracts
        run: |
          prove -b -v \
            t/00-load.t \
            t/20-public-surface.t \
            t/25-performance-regression-benchmark-smoke.t \
            t/26-timer-api.t \
            t/27-timer-scheduling.t \
            t/28-timer-lifecycle.t \
            t/37-current-doc-taxonomy.t \
            t/architecture-00-private-layers.t \
            t/architecture-10-public-leaves.t \
            t/architecture-20-native-consumer.t \
            t/datagram-00-api.t

      - name: Test transformed tree verbosely
        id: full_test
        shell: bash
        run: |
          set +e
          set -o pipefail
          timeout 300 make test TEST_VERBOSE=1 2>&1 | tee full-test.log
          status=${PIPESTATUS[0]}
          if (( status != 0 )); then
            echo "::group::Full test failure tail"
            tail -n 250 full-test.log
            echo "::endgroup::"
          fi
          exit "$status"

      - name: Upload full-suite log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coherent-core-full-test-log
          path: full-test.log
          if-no-files-found: warn
          retention-days: 7

      - name: Commit transformed tree
        run: |
          if [[ -z "$(git status --porcelain)" ]]; then
            echo "transformed tree is already up to date"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Refactor core around coherent IO and Kernel implementation"
          git push origin HEAD:refactor/coherent-private-core
