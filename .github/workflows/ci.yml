name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  AUTOMATED_TESTING: 1

jobs:
  test:
    name: Perl ${{ matrix.label }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - perl: "5.36"
            threaded: false
            label: "5.36"
          - perl: "5.38"
            threaded: false
            label: "5.38"
          - perl: "5.40"
            threaded: false
            label: "5.40"
          - perl: "5.42"
            threaded: false
            label: "5.42"
          - perl: "5.44"
            threaded: false
            label: "5.44"
          - perl: "5"
            threaded: false
            label: "latest"
          - perl: "5.36"
            threaded: true
            label: "5.36 threaded"
          - perl: "5"
            threaded: true
            label: "latest threaded"

    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Perl
        uses: shogo82148/actions-setup-perl@c3e9892cade8a01db1a8498b756f48d6ca98b678 # v1
        with:
          perl-version: ${{ matrix.perl }}
          multi-thread: ${{ matrix.threaded }}

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes libssl-dev

      - name: Install Perl dependencies
        run: cpanm --notest --installdeps .

      - name: Build
        run: |
          perl Makefile.PL
          make --jobs=2

      - name: Test
        run: make test

      - name: Direct awaitable experiment
        if: matrix.label == 'latest'
        run: perl -Mblib .github/direct-awaitable-experiment.pl --iterations=50000 --repeat=7 --warmup=2

      - name: Direct Stream recv payload comparison
        if: matrix.label == 'latest'
        run: perl -Mblib .github/direct-stream-recv-bench.pl --repeat=5 --warmup=1

      - name: Direct Stream recv scale comparison
        if: matrix.label == 'latest'
        run: perl -Mblib .github/direct-stream-recv-scale-bench.pl --repeat=3 --warmup=1

  distribution:
    name: Distribution integrity
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up latest Perl
        uses: shogo82148/actions-setup-perl@c3e9892cade8a01db1a8498b756f48d6ca98b678 # v1
        with:
          perl-version: "5"
          multi-thread: false

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes libssl-dev

      - name: Install Perl dependencies
        run: cpanm --notest --installdeps .

      - name: Build and test distribution
        run: |
          perl Makefile.PL
          make --jobs=2
          make disttest
          make distcheck

      - name: Validate metadata
        run: |
          perl -MCPAN::Meta -e 'CPAN::Meta->load_file("META.json")'
          perl -MCPAN::Meta::YAML -e 'CPAN::Meta::YAML->read("META.yml")'

      - name: Validate POD
        run: |
          perl -MCPAN::Meta -MPod::Checker -e '
            $meta = CPAN::Meta->load_file("META.json")->as_struct;
            $errors = 0;
            for $name (sort keys %{$meta->{provides}}) {
              $errors += Pod::Checker::podchecker(
                $meta->{provides}{$name}{file}
              );
            }
            exit($errors ? 1 : 0);
          '
