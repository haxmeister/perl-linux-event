name: Actual Stream sendfile performance

on:
  pull_request:
    paths:
      - 'xsbytestream/**'
      - 'lib/Linux/Event/_Socket/Stream.pm'
      - 'bench/run-stream-sendfile-bench.pl'
      - 'bench/summarize-stream-sendfile-budget.pl'
      - '.github/workflows/stream-sendfile-integration.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  stream-sendfile:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: shogo82148/actions-setup-perl@c3e9892cade8a01db1a8498b756f48d6ca98b678 # v1
        with:
          perl-version: "5.44"
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes libssl-dev
          cpanm --notest --installdeps .
      - name: Build core
        run: |
          perl Makefile.PL
          make --jobs=2
      - name: Benchmark actual Stream transfers over TCP
        run: |
          mkdir -p bench/results
          perl -Mblib bench/run-stream-sendfile-bench.pl \
            --sizes=64,4096,32768,204800,1048576,8388608 --repeats=3 \
            --jsonl=bench/results/sendfile-stream-normal.jsonl
          perl -Mblib bench/run-stream-sendfile-bench.pl \
            --sizes=32768,204800 --repeats=2 --pressure-us=40 \
            --jsonl=bench/results/sendfile-stream-pressured.jsonl
          perl -MJSON::PP -e '
            for my $file (@ARGV) {
              open my $fh, "<", $file or die $!;
              while (<$fh>) {
                my $r = decode_json($_);
                die "unverified transfer" unless $r->{verified};
                printf "%s %8d B sender CPU %9.4f ms/MiB receiver CPU %9.4f ms/MiB throughput %8.2f MiB/s EAGAIN %s\n",
                  $r->{mode}, $r->{bytes}, $r->{sender_cpu_ms_per_mib},
                  $r->{receiver_cpu_ms_per_mib}, $r->{throughput_mib_s},
                  $r->{eagain_count} // "-";
              }
            }
          ' bench/results/sendfile-stream-*.jsonl
      - name: Retain JSONL data
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: actual-stream-sendfile
          path: bench/results/sendfile-stream-*.jsonl
          if-no-files-found: warn

  budget-sweep:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: shogo82148/actions-setup-perl@c3e9892cade8a01db1a8498b756f48d6ca98b678 # v1
        with:
          perl-version: "5.44"
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes libssl-dev
          cpanm --notest --installdeps .
      - name: Build isolated internal budget variants
        shell: bash
        run: |
          set -euo pipefail
          for budget in 65536 131072 262144 524288; do
            dir="$RUNNER_TEMP/sendfile-budget-$budget"
            mkdir -p "$dir"
            tar --exclude=.git -cf - . | tar -xf - -C "$dir"
            sed -i "s/^#define LES_FILE_DRAIN_BUDGET 65536U$/#define LES_FILE_DRAIN_BUDGET ${budget}U/" \
              "$dir/xsbytestream/stream_write.c"
            grep -qx "#define LES_FILE_DRAIN_BUDGET ${budget}U" \
              "$dir/xsbytestream/stream_write.c"
            (
              cd "$dir"
              perl Makefile.PL > /dev/null
              make --jobs=2 > /dev/null
            )
          done
      - name: Measure real Stream transfers and concurrent timer lateness
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p bench/results
          for order in forward reverse; do
            if [[ "$order" == forward ]]; then
              budgets="65536 131072 262144 524288"
            else
              budgets="524288 262144 131072 65536"
            fi
            for budget in $budgets; do
              (
                cd "$RUNNER_TEMP/sendfile-budget-$budget"
                perl -Mblib bench/run-stream-sendfile-bench.pl \
                  --sizes=1048576,16777216 --repeats=3 \
                  --tick-us=1000 --budget-bytes="$budget" \
                  --jsonl="$GITHUB_WORKSPACE/bench/results/budget-$budget-$order.jsonl"
              )
            done
          done
      - name: Compare paired budgets
        run: perl bench/summarize-stream-sendfile-budget.pl bench/results/budget-*.jsonl
      - name: Retain raw sweep measurements
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: actual-stream-sendfile-budget-sweep
          path: bench/results/budget-*.jsonl
          if-no-files-found: warn
