name: Experimental UDP recvmmsg correctness

on:
  push:
    branches: [feature/udp-recvmmsg-evaluation]
    paths:
      - 'xsdatagram/**'
      - 'lib/Linux/Event/_Socket/Dgram.pm'
      - 't/datagram-*'
      - 'bench/experiments/udp-recvmmsg-*.pl'
      - '.github/workflows/udp-recvmmsg.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  evaluate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: shogo82148/actions-setup-perl@c3e9892cade8a01db1a8498b756f48d6ca98b678 # v1
        with:
          perl-version: '5.44'
      - name: Build Linux::Event
        run: |
          sudo apt-get update
          sudo apt-get install --yes libssl-dev
          cpanm --notest --installdeps .
          perl Makefile.PL
          make -j2
      - name: Test legacy and recvmmsg receive path
        run: |
          set -euo pipefail
          for batch in 0 8 32; do
            echo "receive batch=$batch"
            LINUX_EVENT_EXPERIMENT_RECVMMSG="$batch" \
              prove -b t/datagram-00-api.t t/datagram-10-udp.t \
                t/datagram-11-limits.t t/datagram-12-ownership-and-unix.t \
                t/datagram-13-benchmark-smoke.t t/datagram-14-recvmmsg-experiment.t
          done
      - name: Compare legacy recvmsg with recvmmsg batch=8 and 32
        run: |
          set -euo pipefail
          mkdir -p bench/results/udp
          perl -Mblib -c bench/experiments/udp-recvmmsg-burst.pl
          perl -Mblib bench/experiments/udp-recvmmsg-burst.pl \
            --rounds 1500 --repeats 3 --sizes 64,512,1400,8192 \
            --bursts 8,32 --modes 0,8,32 \
            --output bench/results/udp/recvmmsg-ci.jsonl
      - name: Summarize paired receive CPU comparisons
        run: |
          python3 - <<'PY'
          import json, statistics, collections
          rows=[json.loads(s) for s in open('bench/results/udp/recvmmsg-ci.jsonl')]
          grouped=collections.defaultdict(list)
          for r in rows:
              if r['type']=='trial':
                  assert r['sent']==r['received'] and r['errors']==0, r
                  grouped[(r['bytes'],r['burst'],r['mode'])].append(r['receive_cpu_us_per_packet'])
          for size,burst in sorted({k[:2] for k in grouped}):
              vals={m:statistics.median(grouped[(size,burst,m)]) for m in (0,8,32)}
              print(f'bytes={size:5} burst={burst:2}: recvmsg={vals[0]:.3f}us '
                    f'recvmmsg8={vals[8]:.3f}us ({(vals[0]/vals[8]-1)*100:+.1f}% rate) '
                    f'recvmmsg32={vals[32]:.3f}us ({(vals[0]/vals[32]-1)*100:+.1f}% rate)')
          PY
      - name: Check existing serial UDP echo benchmark, baseline and batch
        run: |
          for batch in 0 16; do
            echo "serial UDP echo batch=$batch"
            LINUX_EVENT_EXPERIMENT_RECVMMSG="$batch" \
              perl -Mblib bench/run-datagram-microbench.pl \
                --packets 3000 --bytes 64 --repeats 1
          done
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: udp-recvmmsg-ci-comparison
          path: bench/results/udp/recvmmsg-ci.jsonl
          if-no-files-found: warn
