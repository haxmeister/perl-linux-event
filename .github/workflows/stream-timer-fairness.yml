name: Stream timer fairness investigation

on:
  push:
    branches: [investigate/stream-timer-fairness]
  workflow_dispatch:

permissions:
  actions: read
  contents: write

concurrency:
  group: stream-timer-fairness-${{ github.ref }}
  cancel-in-progress: true

jobs:
  capture-decision-evidence:
    if: github.event_name == 'push' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0

      - name: Recover original fairness artifact into decision record
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          decision=bench/decisions/BD-2026-09-19-001-stream-timer-fairness
          tmp="$(mktemp -d)"
          gh run download 35409047873 \
            --repo "${{ github.repository }}" \
            --name stream-timer-fairness \
            --dir "$tmp"
          mkdir -p "$decision"
          cp "$tmp"/*.json "$decision"/
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$decision"/*.json
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Preserve Stream timer fairness benchmark evidence"
          git push origin "HEAD:${{ github.ref_name }}"

  benchmark:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up latest Perl
        uses: shogo82148/actions-setup-perl@c3e9892cade8a01db1a8498b756f48d6ca98b678 # v1
        with:
          perl-version: "5"
          multi-thread: false

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes libssl-dev

      - name: Install Perl dependencies
        run: cpanm --notest --installdeps .

      - name: Build
        run: |
          perl Makefile.PL
          make --jobs=2

      - name: Syntax check fairness benchmarks
        run: |
          perl -Mblib -c bench/run-stream-timer-fairness.pl
          perl -Mblib -c bench/run-stream-feedback-timer-fairness.pl

      - name: Run fairness matrix
        run: |
          mkdir -p bench/results
          perl -Mblib bench/run-stream-timer-fairness.pl             --read-size=65536             --budgets=0,65536,262144,1048576             --timer-after=0.250             --producer-duration=1.000             --producer-block=262144             --warmup=1             --repeats=5             --case-timeout=3.000             --json=bench/results/stream-timer-fairness.json

      - name: Run feedback fairness reproducer
        run: |
          perl -Mblib bench/run-stream-feedback-timer-fairness.pl \
            --read-size=65536 \
            --budgets=0,16384,32768,65536,131072,262144 \
            --timer-after=1.500 \
            --message-bytes=64 \
            --window=32 \
            --warmup=1 \
            --repeats=3 \
            --case-timeout=5.000 \
            --json=bench/results/stream-feedback-timer-fairness.json

      - name: Run payload throughput budget sweep
        run: |
          for budget in 0 16384 32768 65536 131072 262144; do
            perl -Mblib bench/run-stream-payload-sweep.pl \
              --sizes=64,4096,32768,200000 \
              --modes=raw,delimiter \
              --repeats=3 \
              --warmup=1 \
              --target-bytes=67108864 \
              --read-size=65536 \
              --read-budget-bytes=$budget \
              --variant=stream-timer-fairness-budget-$budget \
              --commit=${{ github.sha }} \
              --output=bench/results/stream-payload-budget-$budget.json
          done

      - name: Preserve fairness reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: stream-timer-fairness
          path: |
            bench/results/stream-timer-fairness.json
            bench/results/stream-feedback-timer-fairness.json
            bench/results/stream-payload-budget-*.json
          if-no-files-found: warn
